<style>
  :root{
    --bg:#0a0c12;
    --panel:#12151f;
    --gold:#f5c542;
    --gold-2:#ffe9a3;
    --red:#e0344b;
    --green:#39d353;
    --green-dim:#1f6f33;
    --rare:#ff5db1;
    --cell:clamp(82px,21vmin,158px);
    --ink:#e7e9ef;

  ::-moz-selection{background:transparent;color:inherit;}
  html,body{margin:0;padding:0;background:
      radial-gradient(1200px 600px at 50% -10%,#1a1f30 0%,var(--bg) 60%);
      color:var(--ink);

      -webkit-tap-highlight-color:transparent;}

  .title{

    font-size:clamp(26px,7vw,52px);letter-spacing:.04em;line-height:1.05;
    background:linear-gradient(180deg,var(--gold-2),var(--gold) 55%,#b8860b);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 0 rgba(0,0,0,.4);
  }
  .subtitle{color:var(--muted);font-size:13px;letter-spacing:.3em;margin-bottom:18px;text-align:center;}

  .machine{
    width:min(560px,100%);background:linear-gradient(180deg,#1b2030,#0e1019);
    border:2px solid #2a3146;border-radius:22px;padding:22px 18px 20px;
    box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);
    position:relative;
  }
  .reels{display:flex;gap:12px;justify-content:center;}
  .reel{
    position:relative;width:min(30%,150px);height:var(--cell);overflow:hidden;
    background:linear-gradient(180deg,#05060a,#171b28 50%,#05060a);
    border:2px solid #3a445e;border-radius:14px;cursor:pointer;
    box-shadow:inset 0 12px 18px rgba(0,0,0,.8),inset 0 -12px 18px rgba(0,0,0,.8);
    transition:border-color .2s, box-shadow .2s;
  }
  .reel:hover{border-color:var(--gold);}
  .reel.tapped{border-color:var(--red);box-shadow:0 0 0 2px var(--red),0 0 24px rgba(224,52,75,.65);animation:tapwiggle .35s ease;}
  .reel.tapped .hint{opacity:1;color:#ff8a98;font-weight:800;}
  @keyframes tapwiggle{0%{transform:scale(1)}30%{transform:scale(.95)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
  .reel.stopped{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(245,197,66,.4),0 0 18px rgba(245,197,66,.25);}
  .reel.rare{border-color:var(--rare);box-shadow:0 0 26px rgba(255,93,177,.6);}
  .reel.super{border-color:var(--gold);box-shadow:0 0 34px rgba(255,215,0,.85);}
  .reel::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 28%,transparent 72%,rgba(0,0,0,.55));}
  .reel .hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;color:var(--muted);z-index:3;pointer-events:none;letter-spacing:.15em;}
  .reel.stopped .hint,.reel.spinning .hint{opacity:0;}
  .strip{will-change:transform;}
  .strip .num{
    height:var(--cell);display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:calc(var(--cell)*.64);line-height:1;
    color:#fff;font-feature-settings:"tnum";
    text-shadow:0 0 10px rgba(245,197,66,.25);
  }

  .controls{display:flex;justify-content:center;gap:12px;margin-top:18px;}
  button.btn{
    font-family:inherit;font-weight:800;cursor:pointer;border:none;border-radius:12px;
    padding:13px 22px;font-size:16px;letter-spacing:.08em;color:#1a1205;
    background:linear-gradient(180deg,var(--gold-2),var(--gold));
    box-shadow:0 6px 0 #9c7611,0 10px 18px rgba(0,0,0,.4);
    transition:transform .05s, box-shadow .05s;
  }
  button.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9c7611,0 4px 8px rgba(0,0,0,.4);}
  button.btn.ghost{background:#1c2233;color:var(--ink);box-shadow:0 6px 0 #0c0f18;}
  button.btn:disabled{opacity:.45;cursor:not-allowed;}

  .result{
    width:min(560px,100%);margin-top:18px;min-height:84px;text-align:center;
    opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;
  }
  .result.show{opacity:1;transform:none;}
  .result .lead{font-size:clamp(24px,6vw,38px);font-weight:900;color:var(--gold);
    text-shadow:0 0 16px rgba(245,197,66,.4);}
  .result .reason{font-size:clamp(15px,4vw,20px);margin-top:8px;color:var(--ink);line-height:1.6;}
  .result .reason b{color:var(--gold-2);}

  .rareBanner{
    display:none;margin:6px auto 0;width:min(560px,100%);text-align:center;
    font-weight:900;font-size:clamp(22px,6vw,40px);letter-spacing:.1em;
    color:#fff;padding:10px;border-radius:14px;
    background:linear-gradient(90deg,#ff2e88,#ff5db1,#ffb86c,#ff5db1,#ff2e88);
    background-size:300% 100%;animation:rareflow 1.4s linear infinite, rarepop .5s ease;
    box-shadow:0 0 40px rgba(255,93,177,.7);
  }
  .rareBanner.show{display:block;}
  .rareBanner small{display:block;font-size:clamp(13px,3.5vw,18px);font-weight:700;margin-top:4px;}
  .rareBanner.super{
    background:linear-gradient(90deg,#ffd700,#fff6c0,#ff7ae0,#7af0ff,#fff6c0,#ffd700);
    background-size:400% 100%;animation:rareflow 1.1s linear infinite, rarepop .5s ease;
    color:#3a2a00;box-shadow:0 0 60px rgba(255,215,0,.9);border:2px solid #fff;
    font-size:clamp(24px,7vw,46px);
  }
  @keyframes rareflow{to{background-position:300% 0;}}
  @keyframes rarepop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:#1c2233;color:var(--ink);border:1px solid var(--gold);border-radius:12px;
    padding:12px 20px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;z-index:50;
    box-shadow:0 10px 30px rgba(0,0,0,.5);transition:opacity .25s,transform .25s;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  body.flash{animation:flash .5s ease;}
  @keyframes flash{0%,100%{background-color:transparent}30%{background-color:rgba(255,93,177,.18)}}

  /* dot grid */
  .stats{width:min(560px,100%);margin-top:34px;}
  .stats h2{font-size:13px;letter-spacing:.25em;color:var(--muted);font-weight:700;margin:0 0 10px;text-align:center;}
  .dots{display:grid;grid-template-columns:repeat(50,1fr);gap:2px;
    background:#0c0f18;border:1px solid #232a3d;border-radius:10px;padding:8px;}
  .dot{aspect-ratio:1/1;background:#161b29;border-radius:2px;transition:transform .15s;}
  .dot.seen{background:var(--green);}
  .dot.seen.rare{background:var(--rare);}
  .dot.seen.super{background:var(--gold);box-shadow:0 0 4px var(--gold);}
  .dot.now{outline:2px solid #fff;outline-offset:0;transform:scale(1.9);z-index:2;position:relative;}
  .legend{display:flex;justify-content:center;gap:18px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .count{text-align:center;margin-top:12px;font-size:clamp(16px,4.5vw,22px);font-weight:800;}
  .count.count-tier{margin-top:4px;font-size:clamp(14px,4vw,19px);}
  .count .n{color:var(--green);}
  .count .r{color:var(--rare);}
  .count .sr{color:var(--gold);}
  .reset-seen{display:block;margin:10px auto 0;font-size:12px;color:var(--muted);background:none;border:none;text-decoration:underline;cursor:pointer;}

  .share{margin-top:26px;}
  .credit{margin-top:30px;text-align:center;font-size:12px;color:var(--muted);line-height:1.8;}
  .credit a{color:var(--gold);text-decoration:none;}
  .credit a:hover{text-decoration:underline;}
  .credit .ver{color:#5b677e;font-weight:700;letter-spacing:.05em;}

  @media (max-width:560px){
    .dots{grid-template-columns:repeat(40,1fr);}
  }
</style>

/* ====== 言葉生成 ====== */
function cartesian(arrs){
  let res=[''];
  for(const a of arrs){ const n=[]; for(const p of res) for(const x of a) n.push(p+x); res=n; }
  return res;
}
function primaryReading(s){ return [...s].map(d=>KANA[+d]).join(''); }
function hash(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0; return h; }
function getPhrase(s){
  if(DICT_NUM[s]) return {word:DICT_NUM[s][0], comment:DICT_NUM[s][1], fallback:false};
  const cands = cartesian([...s].map(d=>ALT[+d]));
  for(const r of cands){ if(DICT[r]) return {word:DICT[r][0], comment:DICT[r][1], fallback:false}; }
  const r = primaryReading(s);
  return {word:r, comment:fallbackComment(r), fallback:true};
}
/* ティア判定：'super'＝スーパーレア / 'rare'＝レア（語呂・定型文ヒット） / null＝通常 */
function rarityOf(c){
  if(SUPER.has(c)) return 'super';
  if(RARE[c] || !getPhrase(c).fallback) return 'rare';
  return null;
}
function comboIsRare(c){ return rarityOf(c)!==null; }
const pad3 = n=>String(n).padStart(3,'0');
let superTotal=0, rareTotal=0;
for(let n=0;n<1000;n++){ const t=rarityOf(pad3(n)); if(t==='super') superTotal++; else if(t==='rare') rareTotal++; }

/* ====== Audio (WebAudio) ====== */
let AC=null;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }
function tone(freq,dur,type='square',vol=.18,when=0){
  const c=ac(); const t=c.currentTime+when;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.02);
  return o;
}

function playStop(){ const o=tone(440,.16,'triangle',.2); o.frequency.exponentialRampToValueAtTime(180,ac().currentTime+.16); }

}

  [523,659,784,1046,1318,1568,2093].forEach((f,i)=>tone(f,.6,'square',.15,i*.09));
  [659,880,1318,1760,2093].forEach((f,i)=>tone(f,.8,'sawtooth',.09,.7+i*.11));
  [1046,1568,2093].forEach((f,i)=>tone(f,1.0,'triangle',.12,1.3+i*.14));
}
function playTick(){ tone(1200,.02,'square',.05); }

/* ====== Reels ====== */
const reelsEl=document.getElementById('reels');
const REELN=3, REPEAT=60;
const reels=[];
for(let i=0;i<REELN;i++){
  const r=document.createElement('div');
  r.className='reel spinning'; r.dataset.i=i;
  const strip=document.createElement('div'); strip.className='strip';
  let html=''; for(let k=0;k<REPEAT*10;k++) html+=`<div class="num">${k%10}</div>`;
  strip.innerHTML=html;
  const hint=document.createElement('div'); hint.className='hint'; hint.textContent='TAP';
  r.appendChild(strip); r.appendChild(hint);
  reelsEl.appendChild(r);
  reels.push({el:r,strip,pos:Math.random()*1000,speed:1700+Math.random()*300,
              spinning:true,committed:false,finished:false,target:null,stopping:false});
}
let cellH=reels[0].el.getBoundingClientRect().height;
function recalcCell(){ cellH=reels[0].el.getBoundingClientRect().height; }
window.addEventListener('resize',recalcCell);

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  const cycle=cellH*10;
  for(const r of reels){
    if(r.spinning && !r.stopping){
      r.pos += r.speed*dt;
      r.strip.style.transform=`translateY(${-(r.pos%cycle)}px)`;
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function easeOutQuart(t){ return 1-Math.pow(1-t,4); }
function easeOutQuint(t){ return 1-Math.pow(1-t,5); }

let committedCount=0, finishedCount=0;

function stopReel(i, opts={}){
  const r=reels[i];
  if(r.committed) return;
  r.committed=true; committedCount++;
  r.target = (Math.random()*10|0);
  r.value = r.target;

  // この瞬間が「最後の1つ」なら、ティア判定して演出を強める
  let duration=opts.duration||0.65, extra=opts.extra||3, slow=false;
  if(committedCount===3){
    const combo=reels.map(x=>x.target).join('');
    const tier=rarityOf(combo);
    if(tier==='super'){ duration=3.4; extra=7; slow=true; reels.forEach(x=>x.el.classList.add('super')); }
    else if(tier==='rare'){ duration=2.6; extra=5; slow=true; reels.forEach(x=>x.el.classList.add('rare')); }
  }
  animateStop(r,duration,extra,slow);
}

function animateStop(r,duration,extra,slow){
  r.spinning=false; r.stopping=true;
  const cycle=cellH*10;
  const cur=r.pos%cycle;
  const targetOff=r.target*cellH;
  const delta=((targetOff-cur+cycle)%cycle)+extra*cycle;
  const start=performance.now();
  const ease=slow?easeOutQuint:easeOutQuart;
  let lastTick=-1;
  function step(now){
    let t=(now-start)/(duration*1000);
    if(t>=1) t=1;
    const off=cur+delta*ease(t);
    r.strip.style.transform=`translateY(${-(off%cycle)}px)`;
    const idx=Math.floor((off%cycle)/cellH);
    if(idx!==lastTick){ lastTick=idx; if(t<0.96) playTick(); }
    if(t<1){ requestAnimationFrame(step); }
    else{
      r.pos=off; r.stopping=false; r.finished=true;
      r.el.classList.remove('spinning','tapped'); r.el.classList.add('stopped');
      playStop();
      finishedCount++;
      if(finishedCount===REELN) finalize();
    }
  }
  requestAnimationFrame(step);
}

/* クリック：選択音→0.5秒後にゆっくり停止 */
reels.forEach((r,i)=>{
  r.el.addEventListener('click',()=>{
    if(!r.spinning || r.committed || r.pendingClick) return;
    r.pendingClick=true;
    r.el.classList.add('tapped');
    r.el.querySelector('.hint').textContent='とまる…';
    playSelect();
    setTimeout(()=>stopReel(i),500);
  });
});

/* 統合ボタン：回転中は「ストップ」（左から0.5秒ずつ順に停止）／確定後は「もう一回」 */
const actionBtn=document.getElementById('action');
let mode='spin';
actionBtn.addEventListener('click',()=>{
  if(mode==='spin'){
    if(reels.every(r=>r.committed)) return;
    playSelect();
    actionBtn.disabled=true;
    for(let i=0;i<REELN;i++){
      setTimeout(()=>{ if(!reels[i].committed) stopReel(i); }, i*500);
    }
  }else{
    reset();
  }
});

/* ====== 結果確定 ====== */
const resultEl=document.getElementById('result');
const rareBanner=document.getElementById('rareBanner');
let lastResult=null;

function finalize(){
  const combo=reels.map(r=>r.value).join('');
  const {word,comment}=getPhrase(combo);
  const tier=rarityOf(combo);
  lastResult={combo,word,tier};

  if(tier==='super'){
    document.body.classList.remove('flash'); void document.body.offsetWidth;
    document.body.classList.add('flash');
    const msg = RARE[combo] ? RARE[combo] : `${word}！誰もが納得の超しっくり当て字`;
    rareBanner.className='rareBanner super show';
    rareBanner.innerHTML=`★★ スーパーレア！★★<small>「${combo}」 ${msg}</small>`;
    playSuper();
  }else if(tier==='rare'){
    document.body.classList.remove('flash'); void document.body.offsetWidth;
    document.body.classList.add('flash');
    const msg = RARE[combo] || `特別な言葉「${word}」を引き当てました！`;
    rareBanner.className='rareBanner show';
    rareBanner.innerHTML=`★ レア！ ★<small>「${combo}」 ${msg}</small>`;
    playRare();
  }else{
    rareBanner.className='rareBanner';
    playDecide();
  }

  resultEl.innerHTML=
    `<div class="lead">いい数字ですね！</div>`+
    `<div class="reason">「${combo}」＝<b>「${word}」</b>${comment}</div>`;
  resultEl.classList.add('show');

  recordCombo(combo,tier);
  mode='done';
  actionBtn.textContent='もう一回';
  actionBtn.classList.add('ghost');
  actionBtn.disabled=false;
}

/* ====== もう一回 ====== */
function reset(){
  mode='spin';
  actionBtn.textContent='ストップ';
  actionBtn.classList.remove('ghost');
  actionBtn.disabled=false;
  resultEl.classList.remove('show');
  rareBanner.className='rareBanner';
  for(const r of reels){
    r.spinning=true; r.committed=false; r.finished=false; r.stopping=false;
    r.pendingClick=false; r.target=null; r.value=null;
    r.speed=1700+Math.random()*300;
    r.el.classList.remove('stopped','rare','super','tapped'); r.el.classList.add('spinning');
    r.el.querySelector('.hint').textContent='TAP';
  }
  committedCount=0; finishedCount=0;
  recalcCell();
}

/* ====== 1000ドット記録 ====== */
const dotsEl=document.getElementById('dots');
const cntEl=document.getElementById('cnt');
const rcntEl=document.getElementById('rcnt');
const srcntEl=document.getElementById('srcnt');
const SEEN_KEY='mks_seen_v1';
let seen=new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||'[]'));
const dotNodes=[];
(function buildDots(){
  const frag=document.createDocumentFragment();
  for(let n=0;n<1000;n++){
    const d=document.createElement('div');
    const key=String(n).padStart(3,'0');
    d.className='dot'; d.title=key;
    if(seen.has(key)){ d.classList.add('seen'); const t=rarityOf(key); if(t) d.classList.add(t); }
    frag.appendChild(d); dotNodes.push(d);
  }
  dotsEl.appendChild(frag);
  updateCounts();
})();
function updateCounts(){
  cntEl.textContent=seen.size;
  let sc=0, rc=0;
  for(const k of seen){ const t=rarityOf(k); if(t==='super') sc++; else if(t==='rare') rc++; }
  srcntEl.textContent=`${pad3(sc)} / ${pad3(superTotal)}`;
  rcntEl.textContent=`${pad3(rc)} / ${pad3(rareTotal)}`;
}
function recordCombo(combo,tier){
  const idx=parseInt(combo,10);
  seen.add(combo);
  localStorage.setItem(SEEN_KEY,JSON.stringify([...seen]));
  const d=dotNodes[idx];
  d.classList.add('seen'); if(tier) d.classList.add(tier);
  dotNodes.forEach(x=>x.classList.remove('now'));
  d.classList.add('now');
  d.scrollIntoView({block:'nearest',behavior:'smooth'});
  updateCounts();
}
document.getElementById('resetSeen').addEventListener('click',()=>{
  if(!confirm('出た組み合わせの記録をすべて消去しますか？')) return;
  seen=new Set(); localStorage.removeItem(SEEN_KEY);
  dotNodes.forEach(x=>x.classList.remove('seen','rare','super','now'));
  updateCounts();
});

/* ====== シェア ====== */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2800);
}
document.getElementById('share').addEventListener('click',async()=>{
  const c=lastResult;
  const tierTxt = c ? (c.tier==='super'?'しかも【スーパーレア】！！':(c.tier==='rare'?'しかも【レア】。':'')) : '';
  const text = c
    ? `「${c.combo}」…かじた式スロットが選んだこの数字、ただの偶然だと思いますか？${tierTxt}「${c.word}」——あなたが回すと、何が出る？`
    : `かじた式スロットでいい数字を引きました！あなたの『いい数字』は何が出る？`;
  const url=location.href;
  // ① 端末ネイティブの共有（対応端末・httpsのみ）
  if(navigator.share){
    try{ await navigator.share({title:'かじた式スロット',text,url}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  // ② Xの投稿画面を開く（ユーザー操作直後なのでブロックされにくい）
  const tw=`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
  const w=window.open(tw,'_blank');
  if(w){ toast('Xの投稿画面を開きました'); return; }
  // ③ それも無理ならクリップボードへコピー
  try{ await navigator.clipboard.writeText(text+'\n'+url); toast('シェア文をコピーしました！貼り付けて投稿してね'); }
  catch(_){ toast('コピーできませんでした。手動でシェアしてね'); }
});

document.getElementById('videoLink').href=VIDEO_URL;
